name: Backend CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff

      - name: Ruff lint (errors only)
        run: ruff check backend/ --select E,F --ignore E501
        # E = pycodestyle errors, F = pyflakes
        # E501 = line-too-long ignored during scaffold phase

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Unit tests mock every repository and use fakeredis; nothing connects.
      # A syntactically valid URL is still needed to build the (lazy) engine.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      PUSH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest tests/unit -q

      # Live harnesses (tests/integration/check_*.py) need the real Supabase
      # project and are run by hand; see CLAUDE.md "Testing bar".
