<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sahayak mark: a map pin (where you are) holding a wrench (help arrives),
       riding a green road swoosh. Original artwork. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect id="bg" width="64" height="64" rx="15" fill="url(#tile)"/>
  <g id="art">
    <path d="M10 50 C22 41, 42 41, 54 50" stroke="url(#go)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M32 8c-9.4 0-17 7.3-17 16.4C15 36.6 32 50 32 50s17-13.4 17-25.6C49 15.3 41.4 8 32 8z" fill="#FFFFFF"/>
    <circle cx="32" cy="24.5" r="10" fill="url(#go)"/>
    <path d="M36.6 18.6a5 5 0 0 0-5.9 6.2l-6 6a1.7 1.7 0 0 0 2.4 2.4l6-6a5 5 0 0 0 6.2-5.9l-2.9 2.9-2.5-.6-.6-2.5z" fill="#FFFFFF"/>
  </g>
</svg>
