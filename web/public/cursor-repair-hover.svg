<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <defs>
    <!-- Warm Amber Glow Filter -->
    <filter id="hover-glow" x="-4" y="-4" width="36" height="36" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="rgba(245, 158, 11, 0.75)"/>
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Mirrored Single-Sided Wrench (Head at top-left, Handle down-right) -->
  <g filter="url(#hover-glow)" transform="translate(26, 2) scale(-1, 1)">
    <!-- White Outline -->
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"/>

    <!-- Active Amber Wrench Body -->
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
      fill="#D97706"
      stroke="#B45309"
      stroke-width="1"
      stroke-linejoin="round"
      stroke-linecap="round"/>

    <!-- Bright Gold Highlight -->
    <line x1="6.5" y1="17.5" x2="10.5" y2="13.5" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Electric Click Sparkle at Top-Left Clicking Hotspot -->
  <path d="M3.5 1 L4.2 2.8 L6 3.5 L4.2 4.2 L3.5 6 L2.8 4.2 L1 3.5 L2.8 2.8 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="0.6"/>
</svg>