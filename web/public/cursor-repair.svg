<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <!-- Precision Drop Shadow -->
  <defs>
    <filter id="cursor-shadow" x="-4" y="-4" width="36" height="36" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
  </defs>

  <!-- Mirrored Single-Sided Wrench (Head at top-left, Handle down-right) -->
  <g filter="url(#cursor-shadow)" transform="translate(26, 2) scale(-1, 1)">
    <!-- Crisp White Outer Contour for maximum contrast on all backgrounds -->
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"/>

    <!-- Main Tool Body (Dark Slate / Charcoal) -->
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
      fill="#1E293B"
      stroke="#0F172A"
      stroke-width="1"
      stroke-linejoin="round"
      stroke-linecap="round"/>

    <!-- Subtle Metallic Inner Groove -->
    <line x1="6.5" y1="17.5" x2="10.5" y2="13.5" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>